[project]
name = "mibarra"
version = "2.1.0"
description = "Una barra para Windows 10 y 11 con apps, ventanas abiertas y widgets en vivo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.5", "psutil>=5.9"]

[project.optional-dependencies]
windows = [
    "winrt-runtime>=2",
    "winrt-Windows.Foundation>=2",
    "winrt-Windows.Media.Control>=2",
    "winrt-Windows.Devices.Radios>=2",
]

[tool.ruff]
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B023"]   # usamos lambdas con valores por defecto a propósito

[tool.pytest.ini_options]
testpaths = ["tests"]
