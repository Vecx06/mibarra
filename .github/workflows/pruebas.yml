name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
          python -m pip install -r requirements-opcional.txt
      - name: Revisar estilo del código (ruff)
        run: ruff check .
      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
          MIBARRA_CAPTURAS: ${{ github.workspace }}\capturas
        run: python -m pytest -v -s
      - name: Guardar capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-py${{ matrix.python }}
          path: capturas
          if-no-files-found: ignore
