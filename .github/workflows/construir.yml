name: Construir instalador

# Corre cuando se publica una versión en "Releases" (o a mano desde la pestaña Actions).
# Arma mibarra.exe, el instalador y la versión portátil, los prueba, y los sube a la versión.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-opcional.txt pyinstaller
      - name: Construir mibarra.exe
        run: python construir.py
      - name: Probar el .exe
        shell: pwsh
        run: |
          $env:MIBARRA_DATOS = "$env:RUNNER_TEMP\datos"
          $p = Start-Process dist\mibarra\mibarra.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Get-Content "$env:MIBARRA_DATOS\mibarra.log"; throw "mibarra.exe se cerró solo" }
          Stop-Process -Name mibarra -Force
          Start-Process dist\mibarra\mibarra.exe -ArgumentList "--restaurar" -Wait
          Get-Content "$env:MIBARRA_DATOS\mibarra.log"
          if (-not (Select-String -Path "$env:MIBARRA_DATOS\mibarra.log" -Pattern "Iniciando mibarra")) { throw "no arrancó" }
      - name: Armar el instalador (Inno Setup)
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc /DVersion=$version instalador.iss
          Get-ChildItem dist
      - name: Guardar los archivos
        uses: actions/upload-artifact@v4
        with:
          name: mibarra-windows
          path: |
            dist/*-instalador.exe
            dist/*-portable.zip
      - name: Subir a la versión publicada
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist\*-instalador.exe) (Get-ChildItem dist\*-portable.zip) --clobber
